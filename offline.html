<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Dakhina Group</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F3D2E;
      color: #FAF7F0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(184, 147, 74, 0.3);
      padding: 2.5rem;
      border-radius: 1rem;
      max-width: 480px;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: #B8934A;
      margin-top: 0;
      font-size: 1.75rem;
    }
    p {
      line-height: 1.6;
      color: #D1D5DB;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      background-color: #B8934A;
      color: #0F3D2E;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background-color: #d4ae5c;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connection Unavailable</h1>
    <p>You appear to be offline. The cached pages of Dakhina Group remain accessible once your network reconnects.</p>
    <p>For urgent inquiries: <strong>+880 1407 048190</strong></p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
