# Production Nginx Security Headers Configuration for Dakhina Group
# Include this block inside the server { ... } block

# HSTS (Strict-Transport-Security)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Prevent MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (restrict sensitive hardware features)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

# Content Security Policy (CSP)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-src 'self' https://www.youtube.com https://maps.google.com https://*.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self' https:;" always;

# Caching for immutable static assets
location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|svg)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
